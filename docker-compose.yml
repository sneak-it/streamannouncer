services:
  streamannouncer:
    build: .
    container_name: streamannouncerbot
    restart: unless-stopped
    # Run as the unprivileged node user (uid 1000)
    user: "1000:1000"
    # Security baselines: drop all capabilities and prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=production
    # Load configuration from the .env file
    env_file:
      - .env
    volumes:
      # Mount the local data directory to persist the SQLite database
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
